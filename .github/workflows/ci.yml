name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 部署目标是 macOS 14（旧版适配包要能在 Sonoma 启动），但编译 Liquid Glass 需要 macOS 26 SDK，
    # 所以 runner 还得用 macos-26（见 Package.swift 里 platforms 的注释）。
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 工具链
        run: |
          swift --version
          xcodebuild -version
          python3 --version

      - name: 单元测试（编码器黄金向量 + 通道 + 状态机 + 探针 + 选路）
        # 断言用的是中文文案；界面文案现在按系统语言切换，CI 里固定简体，保证可重复
        env:
          JLUGATE_LANG: zh-Hans
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/swift-test.log

      - name: 单元测试失败摘要
        if: failure()
        run: |
          echo "— 失败用例 / 编译错误 —"
          grep -E "✘|error:|failed after|Test run with" /tmp/swift-test.log | head -60 || true
          grep -E "✘|error:|failed after|Test run with" /tmp/swift-test.log | head -40 | while IFS= read -r line; do
            echo "::error title=swift-test::$line"
          done
          echo "— 最后 80 行 —"
          tail -80 /tmp/swift-test.log || true

      - name: 离线自测 · Dr.Com（模拟网关）
        run: swift run jlugate-probe --self-test --seconds 6

      - name: 离线自测 · 网页认证（模拟门户）
        run: swift run jlugate-probe --portal-self-test --seconds 6

      - name: 隐私自检（不许有真实抓包/MAC/学号）
        run: ./scripts/privacy-scan.sh

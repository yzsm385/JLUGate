name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    # 与 CI 一致：macOS 26 才有本项目使用的 SwiftUI 新 API
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 校验 Tag 与 VERSION 一致（防止旧代码打成新版本包）
        run: |
          set -eux
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          EXPECTED_TAG="v${VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} 与 VERSION(${VERSION}) 不一致，拒绝打包！"
            exit 1
          fi

      - name: 构建便携包（新版 App + 卸载脚本 + 说明；CI 上跳过 DMG）
        run: |
          set -eux
          ./scripts/make-portable-package.sh
          ls -lh dist

      - name: 构建便携包（旧版适配 macOS 14，无 Liquid Glass）
        run: |
          set -eux
          ./scripts/make-portable-package-compat.sh
          ls -lh dist

      - name: 组装并校验资产（精确匹配 VERSION + 校验目录名/Info.plist/图标）
        run: |
          set -eux
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p out
          zip="dist/JLU Gate ${VERSION}.zip"
          compat="dist/JLU Gate ${VERSION} (Compat).zip"
          test -f "$zip"
          test -f "$compat"

          # 校验 zip 内目录名、Info.plist 版本号与图标资源均与本次发布一致
          unzip -p "$zip" "JLU Gate ${VERSION}/JLU Gate.app/Contents/Info.plist" | grep -q "<string>${VERSION}</string>"
          unzip -l "$zip" | grep -q "JLU Gate ${VERSION}/JLU Gate.app/Contents/Resources/AppIcon.icns"
          unzip -l "$zip" | grep -q "JLU Gate ${VERSION}/JLU Gate.app/Contents/Resources/Assets.car"
          unzip -p "$compat" "JLU Gate ${VERSION} (Compat)/JLU Gate (Compat).app/Contents/Info.plist" | grep -q "<string>${VERSION}</string>"
          unzip -l "$compat" | grep -q "JLU Gate ${VERSION} (Compat)/JLU Gate (Compat).app/Contents/Resources/AppIcon.icns"
          unzip -l "$compat" | grep -q "JLU Gate ${VERSION} (Compat)/JLU Gate (Compat).app/Contents/Resources/Assets.car"

          cp "$zip" "out/JLU-Gate-${{ github.ref_name }}.zip"
          dmg="dist/JLU Gate ${VERSION}.dmg"
          if [ -f "$dmg" ]; then cp "$dmg" "out/JLU-Gate-${{ github.ref_name }}.dmg"; fi
          cp "$compat" "out/JLU-Gate-${{ github.ref_name }}-Compat.zip"
          # 校验清单：App 下载完会拿它核对，防止把截断/被替换的包装进去
          ( cd out && shasum -a 256 JLU-Gate-* > SHA256SUMS.txt )
          ls -lh out

      # 注：原来这里还有一步用 gh 清理 0.1.x 的旧 Release，实测会在 runner 上挂住，
      # 把整个发布队列堵死（1.2.0 卡在 in_progress、后面的 tag 全部排队）。
      # 0.1.x 的 Release 早就删干净了，这一步直接去掉。

      - name: 创建 / 更新 Release
        uses: softprops/action-gh-release@v2
        with:
          name: JLU Gate ${{ github.ref_name }}
          # 用通配符：DMG 做不出来时也不至于让整个 Release 失败
          # 含两份 zip：新版（macOS 26，Liquid Glass）+ 旧版适配（macOS 14，普通材质）
          files: |
            out/JLU-Gate-${{ github.ref_name }}.*
            out/JLU-Gate-${{ github.ref_name }}-Compat.zip
            out/SHA256SUMS.txt
          fail_on_unmatched_files: false
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: false
          prerelease: false
          generate_release_notes: false

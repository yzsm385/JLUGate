# XcodeGen 描述（旧版适配）：`brew install xcodegen && cd App-Compat && xcodegen generate`
# 生成 JLUGate.xcodeproj，引用上一层目录的本地 Swift Package。
#
# 这一份的部署目标是 macOS 14（Sonoma），**不用 Liquid Glass**。
# 和 App/（新版，macOS 26 + Liquid Glass）并列，分别打包、分别发布。
name: JLUGate
options:
  bundleIdPrefix: dev.jlugate
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  JLUGate:
    path: ..

targets:
  JLUGate:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: JLUGate
        product: JLUGateCore
      - package: JLUGate
        product: JLUGateNet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jlugate.app
        PRODUCT_NAME: JLUGate
        MARKETING_VERSION: "1.4.6"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: "JLU Gate"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
